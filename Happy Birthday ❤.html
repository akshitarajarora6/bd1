<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Happy Birthday ❤️</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Nunito+Sans:wght@400;600;700&family=Caveat:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{--cherry:#8B1028;--burg:#4A0718;--rich:#C2183A;--blush:#F7C8D0;--cream:#FFF4E8;--rose:#D98291;color-scheme:dark;
--serif:'Cormorant Garamond',Georgia,serif;--sans:'Nunito Sans',system-ui,sans-serif;--hand:'Caveat','Segoe Print',cursive;
--top:env(safe-area-inset-top,0px);--bot:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--burg);color:var(--cream);font-family:var(--sans);-webkit-tap-highlight-color:transparent}
body{background:radial-gradient(120% 90% at 50% 0%,var(--rich),var(--cherry) 38%,var(--burg)) fixed}
button{font:inherit;color:inherit}:focus-visible{outline:3px solid var(--blush);outline-offset:3px}
#bg{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:0;transition:filter 1.5s}#bg.dim{filter:brightness(.78)}
.glow{position:absolute;border-radius:50%;filter:blur(70px);opacity:.45;animation:breathe 9s ease-in-out infinite}
.g1{width:60vmax;height:60vmax;left:-20vmax;top:-18vmax;background:var(--rich)}.g2{width:50vmax;height:50vmax;right:-18vmax;bottom:-18vmax;background:#6d0b21;animation-delay:-4s}
.fl{position:absolute;bottom:-40px;opacity:0;color:var(--blush);animation:rise linear infinite}.fl.h{color:var(--rich);text-shadow:0 0 12px rgba(247,200,208,.5)}
@keyframes rise{0%{transform:translateY(0) rotate(-8deg);opacity:0}10%,90%{opacity:var(--op)}100%{transform:translateY(-112vh) rotate(12deg);opacity:0}}
@keyframes breathe{50%{opacity:.7;transform:scale(1.08)}}
#prog{position:fixed;top:calc(12px + var(--top));left:0;right:0;display:flex;justify-content:center;gap:8px;z-index:5}
#prog i{width:7px;height:7px;border-radius:50%;background:rgba(247,200,208,.3);transition:.5s}#prog i.on{background:var(--blush);box-shadow:0 0 8px var(--blush)}
.scene{position:relative;z-index:1;min-height:100dvh;display:flex;flex-direction:column;justify-content:center;padding:calc(48px + var(--top)) 20px calc(32px + var(--bot));animation:sin .9s ease both;transition:opacity .5s,transform .5s}
.scene.out{opacity:0;transform:scale(.98) translateY(-8px);pointer-events:none}
@keyframes sin{from{opacity:0;transform:translateY(10px)}}
.c{display:flex;flex-direction:column;align-items:center;text-align:center;gap:22px;width:100%;max-width:640px;margin:0 auto}.c.wide{max-width:1040px}
.title,.disp,.bday{font-family:var(--serif);font-weight:600;line-height:1.05;margin:0}
.title{font-size:clamp(3rem,13vw,6.4rem);opacity:0;animation:tin 2.2s .6s cubic-bezier(.2,.7,.2,1) forwards}
@keyframes tin{from{opacity:0;transform:scale(.88)}to{opacity:1;transform:scale(1);text-shadow:0 0 38px rgba(247,200,208,.55)}}
.sub{font-family:var(--serif);font-style:italic;font-size:clamp(1.25rem,4.6vw,1.7rem);margin:0;color:var(--blush);line-height:1.4;opacity:0;animation:fade 1.4s 2.2s forwards}
.wish{white-space:pre-wrap;font-size:1.1rem;line-height:1.7;margin:0;max-width:34ch;opacity:0;animation:fade 1.4s 3.1s forwards}
.s0 .btn{opacity:0;animation:fade 1.2s 4s forwards}.intro{opacity:1;animation:none;max-width:34ch}
@keyframes fade{to{opacity:1}}
.btn{min-height:54px;padding:14px 34px;border-radius:999px;border:1.5px solid var(--blush);background:rgba(255,244,232,.08);backdrop-filter:blur(6px);font-weight:700;font-size:1.05rem;cursor:pointer;transition:transform .2s,background .3s,box-shadow .3s,color .3s}
.nav-btn{min-height:42px;padding:10px 18px;font-size:.95rem;align-self:flex-start;margin-bottom:8px}
.btn:hover:not(:disabled){background:var(--cream);color:var(--burg);box-shadow:0 0 28px rgba(247,200,208,.45);transform:translateY(-2px)}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none;box-shadow:none}
.btn:active:not(:disabled){transform:scale(.96)}.btn:disabled{opacity:.6;cursor:default}
.btn.ready{background:var(--cream);color:var(--burg);opacity:1;animation:pop .7s ease}@keyframes pop{0%{transform:scale(.8)}60%{transform:scale(1.07)}}
.letter{width:100%;background:linear-gradient(160deg,rgba(255,244,232,.97),rgba(247,200,208,.93));color:var(--burg);border-radius:6px 6px 22px 22px;padding:clamp(24px,6vw,44px) clamp(20px,6vw,42px);text-align:left;border-top:5px solid var(--rich);box-shadow:0 24px 60px rgba(30,0,10,.5)}
.hand{font-family:var(--hand);font-weight:500;line-height:1.35}.head{font-size:clamp(1.7rem,6vw,2.2rem);margin:0 0 18px;color:var(--cherry)}
.para{white-space:pre-wrap;font-family:var(--serif);font-size:clamp(1.2rem,4.3vw,1.4rem);line-height:1.65;margin:0 0 1.1em;opacity:0;animation:fade 1s forwards;overflow-wrap:anywhere}
.final{max-width:860px;margin:0 auto;text-align:center;box-shadow:0 0 70px rgba(247,200,208,.3),0 24px 60px rgba(30,0,10,.55);background:linear-gradient(180deg,rgba(255,244,232,.98),rgba(249,224,228,.96));position:relative;overflow:hidden}
.final::before{content:"";position:absolute;inset:14px;border:1px solid rgba(139,16,40,.18);border-radius:12px;pointer-events:none}
.final .disp{font-size:clamp(2.2rem,8vw,3.2rem);margin-bottom:20px;color:var(--cherry)}
.stanza{white-space:pre-wrap;font-family:var(--serif);font-style:italic;font-size:clamp(1.15rem,3vw,1.48rem);line-height:1.8;margin:0 auto 1.5em;max-width:68ch;opacity:0;animation:fade 1.4s forwards;overflow-wrap:anywhere;letter-spacing:.01em}
.bday{font-size:clamp(2.4rem,10vw,4.4rem);opacity:0;animation:fade 1.6s forwards,gp 3.5s ease-in-out infinite;margin-top:12px}
@keyframes gp{0%,100%{text-shadow:0 0 18px rgba(247,200,208,.4)}50%{text-shadow:0 0 44px rgba(247,200,208,.95)}}
.hope{font-family:var(--serif);font-style:italic;font-size:clamp(1.2rem,4.4vw,1.5rem);color:var(--blush);margin:0;opacity:0;animation:fade 1.6s forwards}
.beat{font-size:2.4rem;color:var(--rich);text-shadow:0 0 18px var(--blush);opacity:0;animation:fade 1s forwards,bt 1.6s ease-in-out infinite}@keyframes bt{50%{transform:scale(1.25)}}
.pzgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,270px),1fr));gap:26px;width:100%;justify-items:center}
.pz{width:100%;max-width:340px;perspective:1200px}
.flip{display:grid;transform-style:preserve-3d;transition:transform 1.1s cubic-bezier(.3,.7,.2,1)}.flipped .flip{transform:rotateY(180deg)}.solved .flip{cursor:pointer}.solved .piece{pointer-events:none}
.face{grid-area:1/1;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:14px;position:relative}
.front{background:rgba(255,244,232,.1);backdrop-filter:blur(8px);padding:10px;border:1px solid rgba(247,200,208,.4);box-shadow:0 14px 34px rgba(30,0,10,.4)}
.board{display:grid;grid-template-columns:repeat(3,1fr);gap:3px;aspect-ratio:1;transition:gap .5s}
.piece{border:0;padding:0;cursor:pointer;border-radius:8px;background-color:var(--burg);box-shadow:inset 0 0 0 1.5px rgba(255,244,232,.35);transition:transform .2s,box-shadow .3s,border-radius .5s;min-width:0}
.piece.sel{transform:scale(1.07);box-shadow:inset 0 0 0 3px var(--cream),0 0 18px var(--blush);z-index:2}
.piece.ok{cursor:default;box-shadow:inset 0 0 0 2px rgba(247,200,208,.85)}.solved .board{gap:0}.solved .piece{border-radius:0;box-shadow:none}
.back{transform:rotateY(180deg);background:var(--cream);border:2px solid var(--rich);display:flex;padding:7px;color:var(--burg)}
.note{position:relative;flex:1;display:flex;align-items:center;justify-content:center;padding:22px 16px;border:1px dashed var(--rose);border-radius:9px;background:repeating-linear-gradient(transparent 0 33px,rgba(217,130,145,.28) 33px 34px)}
.note::before,.note::after{content:'♥';position:absolute;color:var(--rich);font-size:.9rem}.note::before{top:6px;left:9px}.note::after{bottom:6px;right:9px}
.back .hand{white-space:pre-wrap;margin:0;font-size:1.6rem;line-height:34px;text-align:center;overflow-wrap:anywhere}
.foot{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:10px;min-height:44px}.pn{margin:0;font-size:.92rem;color:var(--blush);text-align:left}
.link{background:none;border:0;text-decoration:underline;text-underline-offset:3px;cursor:pointer;min-height:44px;padding:0 6px;opacity:.85}
.burst{position:absolute;inset:0;pointer-events:none;display:grid;place-items:center}.burst span{grid-area:1/1;color:var(--cream);text-shadow:0 0 10px var(--rich);animation:sp 1.1s ease-out forwards}
@keyframes sp{from{transform:scale(.4);opacity:1}to{transform:translate(var(--dx),var(--dy)) scale(1.3);opacity:0}}
@media(max-width:480px){.btn{width:100%;max-width:360px}}
@media(max-height:480px) and (orientation:landscape){.scene{justify-content:flex-start}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-delay:0s!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
.fl,.glow{display:none}.title,.sub,.wish,.s0 .btn,.para,.stanza,.bday,.hope,.beat{opacity:1}}
</style>
</head>

cake:wrap(`<ellipse cx="150" cy="248" rx="125" ry="16" fill="#F7C8D0"/><rect x="62" y="170" width="176" height="76" rx="10" fill="#C2183A"/><rect x="92" y="126" width="116" height="48" rx="10" fill="#D6254A"/><path d="M62 180 q15 22 30 0 q15 22 30 0 q15 22 30 0 q15 22 30 0 q15 22 30 0 q15 22 28 0 v-12 h-178z" fill="#FFF4E8"/><path d="M92 136 q14 18 29 0 q14 18 29 0 q14 18 29 0 q14 18 29 0 v-12 h-116z" fill="#FFF4E8"/>${candle(104)}${candle(145)}${candle(186)}<circle cx="80" cy="220" r="8" fill="#F7C8D0"/><circle cx="150" cy="226" r="8" fill="#F7C8D0"/><circle cx="220" cy="220" r="8" fill="#F7C8D0"/>`,'#6B0C22','#2E0410'),
envelope:wrap(`<rect x="40" y="82" width="220" height="150" rx="10" fill="#FFF4E8"/><path d="M40 228 L120 148 M260 228 L180 148" stroke="#F7C8D0" stroke-width="4"/><path d="M40 82 L150 166 L260 82Z" fill="#F7C8D0"/>${mini(120,150,.22,'#C2183A')}<rect x="62" y="196" width="70" height="5" rx="2" fill="#D98291"/><rect x="62" y="208" width="46" height="5" rx="2" fill="#D98291"/>`,'#A3132F','#4A0718'),
stars:wrap(`<circle cx="224" cy="70" r="30" fill="#FFF4E8"/><circle cx="238" cy="62" r="28" fill="#2E0410"/>${star(60,60,2.2)}${star(130,40,1.4)}${star(40,150,1.6)}${star(250,160,2)}${star(110,110,1)}${star(200,120,1.2)}${star(70,250,1.4)}${star(260,250,1.2)}${mini(150,150,.3,'#F7C8D0')}${mini(75,205,.18,'#D98291')}${mini(220,215,.22,'#C2183A')}${mini(185,60,.12,'#D98291')}`,'#2E0410','#12010A'),
heart:wrap(`<path d="${H}" fill="#C2183A"/><path d="${H}" fill="none" stroke="#8B1028" stroke-width="5"/><path d="M95 112 C108 96 128 98 138 112" fill="none" stroke="#FFF4E8" stroke-width="9" stroke-linecap="round" opacity=".8"/>${mini(52,60,.1,'#8B1028')}${mini(250,70,.12,'#C2183A')}${mini(45,240,.1,'#C2183A')}${mini(255,235,.1,'#8B1028')}`,'#F7C8D0','#D98291')};
const artUrl=k=>'data:image/svg+xml,'+encodeURIComponent(ART[k]||ART.heart);

const $=(t,c,txt)=>{const e=document.createElement(t);if(c)e.className=c;if(txt!=null)e.textContent=txt;return e};
const paras=t=>t.split(/\n\s*\n/).filter(s=>s.trim());
const reduced=()=>matchMedia('(prefers-reduced-motion: reduce)').matches;
const app=document.getElementById('app'),bg=document.getElementById('bg'),dots=[...document.querySelectorAll('#prog i')];
const solved=[false,false];let leaving=false,cur=0;

// floating background
['♥','✦','♥','★','✧'].forEach((g,k)=>{for(let i=0;i<5;i++){const s=$('span','fl'+(g==='♥'?' h':''),g);
s.style.cssText=`left:${Math.random()*100}%;font-size:${10+Math.random()*22}px;animation-duration:${14+Math.random()*16}s;animation-delay:-${Math.random()*24}s;--op:${.15+Math.random()*.4}`;bg.appendChild(s)}});

function button(label,fn,aria){const b=$('button','btn',label);b.type='button';if(aria)b.setAttribute('aria-label',aria);b.onclick=fn;return b}
function prevButton(){const b=$('button','btn nav-btn','← Previous');b.type='button';b.disabled=cur===0;b.setAttribute('aria-label','Go to previous page');b.onclick=()=>{if(cur>0)go(cur-1)};return b}
function prevButtonVisible(showOnFirst=false){const b=$('button','btn nav-btn','← Previous');b.type='button';b.disabled=cur===0||(!showOnFirst && cur===0);b.setAttribute('aria-label','Go to previous page');b.onclick=()=>{if(cur>0)go(cur-1)};return b}
function go(n){if(leaving)return;leaving=true;app.firstChild.classList.add('out');
setTimeout(()=>{show(n);leaving=false;scrollTo(0,0)},reduced()?0:550)}
function show(n){cur=n;app.innerHTML='';bg.classList.toggle('dim',n===3);dots.forEach((d,i)=>d.classList.toggle('on',i<=n));
const s=$('section','scene s'+n),c=$('div','c');s.appendChild(c);app.appendChild(s);
[s0,s1,s2,s3][n](c)}

function s0(c){c.append($('h1','title','Happy Birthday!'),$('p','sub','Today is a little more special because it’s your day. ❤️'),$('p','wish',CONTENT.openingWish),
button('Next →',()=>go(1),'Next: open your letter'))}
function s1(c){const l=$('div','letter');l.appendChild($('h2','hand head','A little something I wanted to tell you…'));
paras(CONTENT.personalMessage).forEach((p,i)=>{const e=$('p','para',p);e.style.animationDelay=(.3+Math.min(i,12)*.4)+'s';l.appendChild(e)});
c.append(prevButtonVisible(),l,button('Next →',()=>go(2),'Next: the puzzles'))}
function s2(c){c.classList.add('wide');const intro=$('p','sub intro','Just two little puzzles.Let’s see if you can solve them.❤️');
const grid=$('div','pzgrid');const cont=button('0 of 2 solved',()=>go(3));cont.disabled=true;
const done=i=>{solved[i]=true;const n=solved.filter(Boolean).length;
if(n===2){cont.disabled=false;cont.classList.add('ready');cont.textContent='You found both. Continue →'}else cont.textContent=n+' of 2 solved'};
CONTENT.puzzles.forEach((p,i)=>grid.appendChild(puzzle(i,p,done)));
const n=solved.filter(Boolean).length;if(n===2){cont.disabled=false;cont.classList.add('ready');cont.textContent='You found both. Continue →'}
c.append(prevButtonVisible(),intro,grid,cont)}
function s3(c){const l=$('div','letter final');l.appendChild($('h2','disp','One last thing…'));
const ps=paras(CONTENT.finalMessage);ps.forEach((p,i)=>{const e=$('p','stanza',p);e.style.animationDelay=(.8+i*.9)+'s';l.appendChild(e)});
const d=.8+ps.length*.9+.6;const b=$('h2','bday','Happy Birthday! ❤️'),h=$('p','hope','I hope this year brings you so many reasons to smile.'),t=$('div','beat','♥');
b.style.animationDelay=d+'s';h.style.animationDelay=(d+1)+'s';t.style.animationDelay=(d+1.8)+'s';c.append(prevButtonVisible(),l,b,h,t)}

/* ---------- jigsaw: tap a piece, tap another to swap (touch, mouse, keyboard) ---------- */
function puzzle(idx,cfg,onDone){const N=3,T=9,src=cfg.image||artUrl(cfg.art);
let order,sel=null,isSolved=solved[idx];
do{order=[...Array(T).keys()];for(let i=T-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[order[i],order[j]]=[order[j],order[i]]}}while(order.some((p,i)=>p===i));
if(isSolved)order=[...Array(T).keys()];
const root=$('article','pz'+(isSolved?' solved flipped':'')),flip=$('div','flip'),front=$('div','face front'),back=$('div','face back'),board=$('div','board'),
note=$('p','pn','Tap a piece, then tap another to swap them.'),foot=$('div','foot'),hint=$('button','link','Need a hint?');
board.setAttribute('role','group');board.setAttribute('aria-label','Puzzle '+(idx+1));hint.type='button';note.setAttribute('aria-live','polite');
const nt=$('div','note');nt.appendChild($('p','hand',cfg.message));back.appendChild(nt);back.setAttribute('aria-label','Hidden message');
const pieces=order.map((_,slot)=>{const b=$('button','piece');b.type='button';b.onclick=()=>tap(slot);board.appendChild(b);return b});
function paint(){pieces.forEach((b,slot)=>{const p=order[slot];b.style.backgroundImage=`url("${src}")`;b.style.backgroundSize=`${N*100}% ${N*100}%`;
b.style.backgroundPosition=`${(p%N)/(N-1)*100}% ${Math.floor(p/N)/(N-1)*100}%`;b.classList.toggle('ok',p===slot);b.classList.toggle('sel',sel===slot);
b.disabled=isSolved;b.setAttribute('aria-label','Position '+(slot+1)+(p===slot?', correctly placed':sel===slot?', selected':''))})}
function apply(o){order=o;sel=null;paint();
if(o.every((p,i)=>p===i)){isSolved=true;hint.remove();note.textContent='You solved it! ❤️';burst();pieces.forEach(b=>b.disabled=true);
setTimeout(()=>{root.classList.add('solved','flipped');setTimeout(()=>{enableFlip();onDone(idx)},reduced()?0:1200)},500)}
else note.textContent=o.filter((p,i)=>p===i).length+' of '+T+' in place.'}
function tap(slot){if(isSolved||order[slot]===slot)return;if(sel===null){sel=slot;return paint()}
if(sel===slot){sel=null;return paint()}const o=[...order];[o[sel],o[slot]]=[o[slot],o[sel]];apply(o)}
hint.onclick=()=>{if(isSolved)return;const slot=order.findIndex((p,i)=>p!==i),from=order.indexOf(slot),o=[...order];[o[slot],o[from]]=[o[from],o[slot]];apply(o)};
function enableFlip(){hint.remove();note.textContent='Tap the card to see the photo';
const toggle=()=>{const f=root.classList.toggle('flipped');back.setAttribute('aria-hidden',String(!f));note.textContent=f?'Tap the card to see the photo':'Tap the card to read the message'};
flip.tabIndex=0;flip.setAttribute('role','button');flip.setAttribute('aria-label','Flip the card to see the photo or the message');
flip.onclick=toggle;flip.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();toggle()}}}
function burst(){const bu=$('div','burst');bu.setAttribute('aria-hidden','true');for(let i=0;i<16;i++){const a=i/16*Math.PI*2,d=70+Math.random()*60,s=$('span','',i%2?'♥':'✦');
s.style.setProperty('--dx',Math.cos(a)*d+'px');s.style.setProperty('--dy',Math.sin(a)*d+'px');bu.appendChild(s)}front.appendChild(bu);setTimeout(()=>bu.remove(),1300)}
front.appendChild(board);flip.append(front,back);foot.appendChild(note);if(!isSolved)foot.appendChild(hint);root.append(flip,foot);
if(isSolved)enableFlip();paint();return root}

show(0);
</script>
</body>
</html>
